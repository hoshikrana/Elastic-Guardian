name: EGX CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Black format check
        run: black --check egx/

      - name: Ruff lint check
        run: ruff check egx/

      - name: MyPy type check
        run: mypy --strict egx/

      - name: Verify package import
        run: python -c "import egx; print('Version:', egx.__version__)"



  unit-tests:
    name: Unit + DSA Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run DSA tests
        run: pytest tests/unit/dsa/ -v --tb=short

      - name: Run all unit tests
        run: pytest tests/unit/ --cov=egx --cov-report=term --cov-fail-under=85



  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/integration/ -v



  gpu-validation:
    name: GPU Validation
    runs-on: [self-hosted, gpu]
    needs: integration-tests
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GPU dependencies
        run: |
          pip install -e ".[dev,flash]"

      - name: Verify GPU
        run: |
          python -c "import torch; print('CUDA available:', torch.cuda.is_available())"

      - name: Run GPU tests
        run: pytest tests/gpu_validation/ -v -m gpu